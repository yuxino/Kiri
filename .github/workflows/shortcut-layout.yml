name: Shortcut settings layout

on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/qa/shortcut-settings-*", ".github/workflows/shortcut-layout.yml", "package.json", "pnpm-lock.yaml"]
  pull_request:
    paths: ["src/**", "scripts/qa/shortcut-settings-*", ".github/workflows/shortcut-layout.yml", "package.json", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortcut-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, browser: chromium}
          - {os: ubuntu-24.04, browser: chromium}
          - {os: ubuntu-24.04, browser: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # Match the existing renderer QA runtime; no app dependency or browser
      # version is installed into the user's Tauri application.
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python scripts/qa/shortcut-settings-ui.py --browser ${{ matrix.browser }} --fail-fast
        env:
          KIRI_SHORTCUT_QA_OUT: ${{ runner.temp }}/shortcut-layout-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shortcut-layout-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/shortcut-layout-review/
          retention-days: 5
          if-no-files-found: warn
