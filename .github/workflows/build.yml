name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  countdown-ui:
    name: Countdown renderer checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - run: pnpm build
      - run: python -m pip install playwright==1.55.0 imageio-ffmpeg==0.6.0 Pillow==11.3.0
      - run: python scripts/qa/countdown-ui.py --record
      - name: Verify OCR waits for a committed selection
        run: python docs/demos/full-flow/test-ocr.py
        env:
          KIRI_DEMO_DIST: ${{ github.workspace }}/dist
          KIRI_DEMO_OUT: ${{ runner.temp }}/ocr-selection-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: countdown-renderer-review
          path: |
            countdown-review/
            ${{ runner.temp }}/ocr-selection-review/
            dist/
          retention-days: 5
          if-no-files-found: warn

  test-rust:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build, test and package Linux (Ubuntu 24.04 / X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      deb-artifact-id: ${{ steps.upload-linux-deb.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build and desktop-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev \
            libxcb-randr0-dev \
            libgbm-dev \
            libclang-dev \
            libtesseract-dev \
            libleptonica-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pipewire \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-jpn \
            xvfb openbox xdotool xclip x11-utils dbus-x11 python3-tk python3-pil \
            python3-gi python3-pyatspi at-spi2-core \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
        env:
          KIRI_LINUX_MEDIA_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-media-review
          path: ${{ runner.temp }}/kiri-linux-media-review/
          retention-days: 5
          if-no-files-found: warn
      - name: Build Debian package without updater signing
        run: pnpm tauri build --bundles deb --config src-tauri/tauri.linux.conf.json
      - name: Install and inspect the Debian package
        run: |
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          mkdir -p linux-native-review
          dpkg-deb --info "${packages[0]}" > linux-native-review/package-info.txt
          dpkg-deb --contents "${packages[0]}" > linux-native-review/package-contents.txt
          sha256sum "${packages[0]}" > linux-native-review/package-sha256.txt
          sudo apt-get install -y --no-install-recommends "$(realpath "${packages[0]}")"
          test -x /usr/bin/kiri
          ldd /usr/bin/kiri > linux-native-review/linked-libraries.txt
          if grep -q 'not found' linux-native-review/linked-libraries.txt; then exit 1; fi
      - name: Exercise the installed app on an isolated X11 desktop
        timeout-minutes: 4
        run: bash scripts/qa/linux-native.sh /usr/bin/kiri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-native-review
          path: linux-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        id: upload-linux-deb
        if: ${{ always() && hashFiles('src-tauri/target/release/bundle/deb/*.deb') != '' }}
        with:
          name: kiri-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 5
          if-no-files-found: error

  test-linux-wayland:
    name: GNOME Wayland portal checks (Ubuntu 24.04 / scale ${{ matrix.scale }})
    needs: build-linux
    if: ${{ !cancelled() && needs.build-linux.outputs.deb-artifact-id != '' }}
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.25', '1.5', '2']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kiri-linux-deb
          path: ${{ runner.temp }}/kiri-linux-deb
      - name: Install the candidate and GNOME desktop-test dependencies
        env:
          KIRI_LINUX_DEB_DIR: ${{ runner.temp }}/kiri-linux-deb
          KIRI_LINUX_WAYLAND_QA_DIR: ${{ runner.temp }}/kiri-linux-wayland-review
        run: |
          packages=("$KIRI_LINUX_DEB_DIR"/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          mkdir -p "$KIRI_LINUX_WAYLAND_QA_DIR"
          dpkg-deb --info "${packages[0]}" > "$KIRI_LINUX_WAYLAND_QA_DIR/package-info.txt"
          sha256sum "${packages[0]}" > "$KIRI_LINUX_WAYLAND_QA_DIR/package-sha256.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "${packages[0]}" \
            gnome-shell gnome-settings-daemon \
            xdg-desktop-portal xdg-desktop-portal-gnome pipewire wireplumber \
            libgl1-mesa-dri libegl-mesa0 dbus-x11 at-spi2-core python3-pyatspi \
            python3-gi python3-gi-cairo python3-pil gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-pipewire
          test -x /usr/bin/kiri
      - name: Exercise capture and recording on an isolated GNOME Wayland desktop
        timeout-minutes: 12
        env:
          KIRI_LINUX_WAYLAND_QA_DIR: ${{ runner.temp }}/kiri-linux-wayland-review
          KIRI_QA_DISPLAY_SCALE: ${{ matrix.scale }}
        run: bash scripts/qa/linux-wayland.sh /usr/bin/kiri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-wayland-review-scale-${{ matrix.scale }}
          path: ${{ runner.temp }}/kiri-linux-wayland-review/
          retention-days: 5
          if-no-files-found: warn

  build-macos:
    name: Compile macOS app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Compile without a runnable macOS bundle
        run: pnpm tauri build --no-bundle

  build-windows:
    name: Build and test Windows app (Server 2025)
    runs-on: windows-2025
    env:
      # Keep optimized runtime behavior, with symbols for native crash reports.
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Run Windows regression and native video export tests
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          KIRI_VIDEO_QA_DIR: ${{ runner.temp }}/kiri-video-export-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-video-export-review
          path: ${{ runner.temp }}/kiri-video-export-review/
          retention-days: 5
          if-no-files-found: warn
      - name: Build Windows installer for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.pr-windows.conf.json
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
      - name: Package and verify portable Windows build
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify countdown and recording controls on the actual desktop
        timeout-minutes: 4
        run: |
          python -m pip install pywinauto==0.6.9
          python scripts/qa/countdown-native.py
      - name: Verify configurable shortcuts on the actual desktop
        timeout-minutes: 3
        run: python scripts/qa/shortcut-native.py
      - name: Install and smoke-test both Windows packages
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $install = Join-Path $env:RUNNER_TEMP 'kiri-installed-review'
          $installerProcess = Start-Process $installers[0].FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS installation failed: $($installerProcess.ExitCode)" }
          $env:KIRI_QA_PORTABLE_EXE = Join-Path $env:RUNNER_TEMP 'kiri-portable-verify/kiri.exe'
          $env:KIRI_QA_INSTALLED_EXE = Join-Path $install 'kiri.exe'
          python scripts/qa/windows-release-native.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-review
          path: windows-release-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shortcut-native-review
          path: shortcut-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: countdown-native-review
          path: countdown-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: countdown-debug-build
          path: |
            src-tauri/target/release/kiri.exe
            src-tauri/target/release/*.pdb
          retention-days: 2
          if-no-files-found: warn
      - name: Upload Windows bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: kiri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
