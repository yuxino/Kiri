name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Checks, release packages, one acceptance platform, or full verification'
        type: choice
        required: true
        default: quick
        options: [quick, linux, linux-package, windows, macos, release, full, recheck-linux, recheck-linux-x11]
      linux_candidate_run_id:
        description: 'Completed build run containing the Linux candidate to recheck'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks and requested packages
    runs-on: ubuntu-24.04
    outputs:
      renderer: ${{ steps.plan.outputs.renderer }}
      native_linux: ${{ steps.plan.outputs.native_linux }}
      native_windows: ${{ steps.plan.outputs.native_windows }}
      native_macos: ${{ steps.plan.outputs.native_macos }}
      package_linux: ${{ steps.plan.outputs.package_linux }}
      package_windows: ${{ steps.plan.outputs.package_windows }}
      package_macos: ${{ steps.plan.outputs.package_macos }}
      linux_x11: ${{ steps.plan.outputs.linux_x11 }}
      wayland: ${{ steps.plan.outputs.wayland }}
      x11_recheck: ${{ steps.plan.outputs.x11_recheck }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        run: python3 scripts/qa/ci-plan.py

  fast-checks:
    name: Fast required checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - run: pnpm build
      - name: Verify CI scheduling and quality gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/qa/test_ci_plan.py
          python3 scripts/qa/test_linux_package_provenance.py
          python3 scripts/qa/test_windows_package_provenance.py
          python3 scripts/qa/test_linux_audio_tone.py
      - name: Verify the formal release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

  countdown-ui:
    name: Countdown renderer checks
    needs: plan
    if: needs.plan.outputs.renderer == 'true'
    runs-on: ubuntu-24.04
    # Includes sequential toolbar, image editing, and 24 crop/scale regressions
    # through test-ocr.py. The 6m limit expired after all assertions passed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      # The required fast-checks job runs the Node suite in parallel. Keep this
      # build independent so renderer verification starts without waiting for it.
      - run: pnpm build
      - run: python -m pip install playwright==1.55.0 Pillow==11.3.0
      - run: python scripts/qa/countdown-ui.py
      - name: Verify OCR waits for a committed selection
        run: python docs/demos/full-flow/test-ocr.py
        env:
          KIRI_DEMO_DIST: ${{ github.workspace }}/dist
          KIRI_DEMO_OUT: ${{ runner.temp }}/ocr-selection-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: countdown-renderer-review
          path: |
            countdown-review/
            ${{ runner.temp }}/ocr-selection-review/
            dist/
          retention-days: 5
          if-no-files-found: warn

  test-rust:
    name: Rust tests (macOS)
    needs: plan
    if: needs.plan.outputs.native_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build, test and package Linux (Ubuntu 24.04 / X11)
    needs: plan
    if: needs.plan.outputs.native_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      deb-artifact-id: ${{ steps.upload-linux-deb.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build and desktop-test dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' -e 's|://azure\.archive\.ubuntu\.com/ubuntu|://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libasound2-dev libpulse-dev \
            libxcb-randr0-dev \
            libgbm-dev \
            libclang-dev \
            libtesseract-dev \
            libleptonica-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-tools \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pipewire \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-jpn \
            xvfb openbox xdotool xclip x11-utils dbus-x11 python3-tk python3-pil \
            pulseaudio pulseaudio-utils \
            python3-gi python3-pyatspi at-spi2-core \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: pnpm install --frozen-lockfile
      - name: Check Linux IPC ownership and disposed callbacks
        run: |
          python3 scripts/qa/ipc-lifetime/check-source.py
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --manifest-path scripts/qa/ipc-lifetime/Cargo.toml -- --test-threads=1
      - name: Verify GlobalShortcuts wire protocol on an isolated D-Bus
        run: cargo test --locked --manifest-path scripts/qa/portal-shortcuts/Cargo.toml -- --include-ignored
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
        env:
          KIRI_LINUX_MEDIA_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review
          KIRI_LINUX_VIDEO_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review/video-export
      - name: Verify Linux system audio with a private FIFO sink
        run: |
          for pass in 1 2 3; do
            KIRI_LINUX_MEDIA_QA_DIR="$KIRI_LINUX_MEDIA_QA_DIR/fifo-pass-$pass" \
              bash scripts/qa/linux-audio-fifo.sh
          done
        env:
          KIRI_LINUX_MEDIA_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review
      - name: Verify Linux audio with isolated synthetic Pulse sources
        run: |
          for pass in 1 2 3; do
            KIRI_LINUX_MEDIA_QA_DIR="$KIRI_LINUX_MEDIA_QA_DIR/pulse-pass-$pass" \
              bash scripts/qa/linux-audio.sh
          done
        env:
          KIRI_LINUX_MEDIA_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review
      - name: Verify the 60-second Linux audio/video clock
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml native_audio_long_recording_keeps_shared_clock -- --ignored --nocapture --test-threads=1
        env:
          KIRI_LINUX_MEDIA_QA_DIR: ${{ runner.temp }}/kiri-linux-media-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-media-review
          path: ${{ runner.temp }}/kiri-linux-media-review/
          retention-days: 5
          if-no-files-found: warn
      - name: Build Debian package without updater signing
        if: needs.plan.outputs.package_linux == 'true'
        run: pnpm tauri build --bundles deb --config src-tauri/tauri.linux.conf.json
      - name: Record the actual source commit and package checksum
        if: needs.plan.outputs.package_linux == 'true'
        run: python3 scripts/qa/linux-package-provenance.py write --package-dir src-tauri/target/release/bundle/deb
      - name: Install and inspect the Debian package
        if: needs.plan.outputs.package_linux == 'true'
        run: |
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          mkdir -p linux-native-review
          dpkg-deb --info "${packages[0]}" > linux-native-review/package-info.txt
          dpkg-deb --contents "${packages[0]}" > linux-native-review/package-contents.txt
          sha256sum "${packages[0]}" > linux-native-review/package-sha256.txt
          sudo apt-get install -y --no-install-recommends "$(realpath "${packages[0]}")"
          test -x /usr/bin/kiri
          test -f /usr/share/applications/io.yuxino.kiri.desktop
          grep -qx "Exec=kiri" /usr/share/applications/io.yuxino.kiri.desktop
          grep -qx "NoDisplay=true" /usr/share/applications/io.yuxino.kiri.desktop
          ldd /usr/bin/kiri > linux-native-review/linked-libraries.txt
          if grep -q 'not found' linux-native-review/linked-libraries.txt; then exit 1; fi
      - name: Exercise the installed app on an isolated X11 desktop
        if: needs.plan.outputs.linux_x11 == 'true'
        timeout-minutes: 4
        run: bash scripts/qa/linux-native.sh /usr/bin/kiri
      - name: Verify installed X11 system audio and pause/resume with a private FIFO sink
        if: needs.plan.outputs.linux_x11 == 'true'
        timeout-minutes: 4
        run: |
          KIRI_LINUX_QA_DIR="$PWD/linux-native-review/fifo" \
            bash scripts/qa/linux-audio-fifo.sh /usr/bin/kiri
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_linux == 'true' }}
        with:
          name: linux-native-review
          path: linux-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        id: upload-linux-deb
        if: ${{ always() && needs.plan.outputs.package_linux == 'true' && hashFiles('src-tauri/target/release/bundle/deb/*.deb') != '' }}
        with:
          name: kiri-linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/provenance.json
          retention-days: 5
          if-no-files-found: error

  test-linux-wayland:
    name: GNOME Wayland portal checks (Ubuntu 24.04 / scale ${{ matrix.scale }})
    needs: [plan, build-linux]
    if: ${{ !cancelled() && needs.plan.outputs.wayland == 'true' && (inputs.linux_candidate_run_id != '' || needs.build-linux.outputs.deb-artifact-id != '') }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.25', '1.5', '2']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kiri-linux-deb
          path: ${{ runner.temp }}/kiri-linux-deb
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_candidate_run_id || github.run_id }}
          digest-mismatch: error
      - name: Verify package provenance and unchanged application sources
        env:
          GH_TOKEN: ${{ github.token }}
          KIRI_CANDIDATE_RUN_ID: ${{ inputs.linux_candidate_run_id || github.run_id }}
          KIRI_LINUX_DEB_DIR: ${{ runner.temp }}/kiri-linux-deb
          KIRI_LINUX_WAYLAND_QA_DIR: ${{ runner.temp }}/kiri-linux-wayland-review
        run: |
          python3 scripts/qa/linux-package-provenance.py verify \
            --package-dir "$KIRI_LINUX_DEB_DIR" \
            --output "$KIRI_LINUX_WAYLAND_QA_DIR/package-provenance.json" \
            --run-id "$KIRI_CANDIDATE_RUN_ID"
      - name: Install the candidate and GNOME desktop-test dependencies
        env:
          KIRI_LINUX_DEB_DIR: ${{ runner.temp }}/kiri-linux-deb
          KIRI_LINUX_WAYLAND_QA_DIR: ${{ runner.temp }}/kiri-linux-wayland-review
        run: |
          packages=("$KIRI_LINUX_DEB_DIR"/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          mkdir -p "$KIRI_LINUX_WAYLAND_QA_DIR"
          dpkg-deb --info "${packages[0]}" > "$KIRI_LINUX_WAYLAND_QA_DIR/package-info.txt"
          sha256sum "${packages[0]}" > "$KIRI_LINUX_WAYLAND_QA_DIR/package-sha256.txt"
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' -e 's|://azure\.archive\.ubuntu\.com/ubuntu|://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "${packages[0]}" \
            gnome-shell gnome-settings-daemon \
            xdg-desktop-portal xdg-desktop-portal-gnome pipewire wireplumber \
            libgl1-mesa-dri libegl-mesa0 dbus-x11 at-spi2-core python3-pyatspi \
            python3-gi python3-gi-cairo python3-pil gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-pipewire
          test -x /usr/bin/kiri
      - name: Exercise capture and recording on an isolated GNOME Wayland desktop
        timeout-minutes: 12
        env:
          KIRI_LINUX_WAYLAND_QA_DIR: ${{ runner.temp }}/kiri-linux-wayland-review
          KIRI_QA_DISPLAY_SCALE: ${{ matrix.scale }}
        run: bash scripts/qa/linux-wayland.sh /usr/bin/kiri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-wayland-review-scale-${{ matrix.scale }}
          path: ${{ runner.temp }}/kiri-linux-wayland-review/
          retention-days: 5
          if-no-files-found: warn

  recheck-linux-x11:
    name: Recheck installed X11 app without rebuilding
    needs: plan
    if: needs.plan.outputs.x11_recheck == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kiri-linux-deb
          path: ${{ runner.temp }}/kiri-linux-deb
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_candidate_run_id }}
          digest-mismatch: error
      - name: Verify original package, build and unchanged application sources
        env:
          GH_TOKEN: ${{ github.token }}
          KIRI_CANDIDATE_RUN_ID: ${{ inputs.linux_candidate_run_id }}
          KIRI_LINUX_DEB_DIR: ${{ runner.temp }}/kiri-linux-deb
          KIRI_LINUX_QA_DIR: ${{ github.workspace }}/linux-native-review
        run: |
          # Select the recorded attempt, including artifacts from an older
          # attempt after a rerun. The verifier independently validates it.
          candidate_attempt="$(python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["KIRI_LINUX_DEB_DIR"]) / "provenance.json").read_text())
          attempt = manifest["run_attempt"]
          assert type(attempt) is int and attempt > 0
          print(attempt)
          PYTHON
          )"
          candidate_conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$KIRI_CANDIDATE_RUN_ID/attempts/$candidate_attempt/jobs" \
            --jq '.jobs[] | select(.name == "Build, test and package Linux (Ubuntu 24.04 / X11)") | .conclusion')"
          recheck_flags=()
          if [[ "$candidate_conclusion" == "failure" ]]; then
            recheck_flags+=(--recheck-failed-x11)
          fi
          python3 scripts/qa/linux-package-provenance.py verify \
            --package-dir "$KIRI_LINUX_DEB_DIR" --run-id "$KIRI_CANDIDATE_RUN_ID" \
            --output "$KIRI_LINUX_QA_DIR/package-provenance.json" "${recheck_flags[@]}"
      - name: Install unchanged candidate and X11 desktop-test dependencies
        run: |
          packages=("${{ runner.temp }}/kiri-linux-deb/"*.deb)
          test "${#packages[@]}" -eq 1
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' -e 's|://azure\.archive\.ubuntu\.com/ubuntu|://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[0]}" \
            xvfb openbox xdotool xclip x11-utils dbus-x11 python3-tk python3-pil \
            pulseaudio pulseaudio-utils \
            python3-gi python3-pyatspi at-spi2-core \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-jpn
          test -x /usr/bin/kiri
          ldd /usr/bin/kiri > linux-native-review/linked-libraries.txt
          if grep -q 'not found' linux-native-review/linked-libraries.txt; then exit 1; fi
      - name: Replay all original installed X11 assertions
        timeout-minutes: 4
        run: bash scripts/qa/linux-native.sh /usr/bin/kiri
      - name: Replay installed X11 system audio and pause/resume with a private FIFO sink
        timeout-minutes: 4
        run: |
          KIRI_LINUX_QA_DIR="$PWD/linux-native-review/fifo" \
            bash scripts/qa/linux-audio-fifo.sh /usr/bin/kiri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-native-recheck-review
          path: linux-native-review/
          retention-days: 5
          if-no-files-found: error

  build-macos:
    name: Compile macOS app (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.native_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
        if: needs.plan.outputs.package_macos == 'true'
      - uses: actions/setup-node@v7
        if: needs.plan.outputs.package_macos == 'true'
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        if: needs.plan.outputs.package_macos == 'true'
      - run: pnpm test:release-tools
        if: needs.plan.outputs.package_macos == 'true'
      - name: Check both macOS architectures without packaging
        if: needs.plan.outputs.package_macos != 'true'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Compile without a runnable macOS bundle
        if: needs.plan.outputs.package_macos == 'true'
        run: pnpm tauri build --no-bundle

  build-windows:
    name: Build and test Windows app (Server 2025)
    needs: plan
    if: needs.plan.outputs.native_windows == 'true'
    runs-on: windows-2025
    env:
      # Keep optimized runtime behavior, with symbols for native crash reports.
      CARGO_PROFILE_RELEASE_DEBUG: "1"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release-tools
      - name: Run Windows regression and native video export tests
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          KIRI_VIDEO_QA_DIR: ${{ runner.temp }}/kiri-video-export-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-video-export-review
          path: ${{ runner.temp }}/kiri-video-export-review/
          retention-days: 5
          if-no-files-found: warn
      - name: Build Windows acceptance installer
        if: needs.plan.outputs.package_windows == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.pr-windows.conf.json
      - uses: tauri-apps/tauri-action@v0
        if: needs.plan.outputs.package_windows == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
      - name: Package and verify portable Windows build
        if: needs.plan.outputs.package_windows == 'true'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1
      - uses: actions/setup-python@v6
        if: needs.plan.outputs.package_windows == 'true'
        with:
          python-version: '3.12'
      - name: Verify countdown and recording controls on the actual desktop
        if: needs.plan.outputs.package_windows == 'true'
        timeout-minutes: 4
        run: |
          python -m pip install pywinauto==0.6.9 Pillow==11.3.0
          python scripts/qa/countdown-native.py
      - name: Verify configurable shortcuts on the actual desktop
        if: needs.plan.outputs.package_windows == 'true'
        timeout-minutes: 3
        run: python scripts/qa/shortcut-native.py
      - name: Verify destructive confirmation windows on the actual desktop
        if: needs.plan.outputs.package_windows == 'true'
        timeout-minutes: 3
        run: python scripts/qa/confirmation-native.py
      - name: Install and smoke-test both Windows packages
        if: needs.plan.outputs.package_windows == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $install = Join-Path $env:RUNNER_TEMP 'kiri-installed-review'
          $installerProcess = Start-Process $installers[0].FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) { throw "NSIS installation failed: $($installerProcess.ExitCode)" }
          $env:KIRI_QA_PORTABLE_EXE = Join-Path $env:RUNNER_TEMP 'kiri-portable-verify/kiri.exe'
          $env:KIRI_QA_INSTALLED_EXE = Join-Path $install 'kiri.exe'
          python scripts/qa/windows-release-native.py
      - name: Verify hover colors and native clipboard on the installed Windows app
        if: needs.plan.outputs.package_windows == 'true'
        timeout-minutes: 4
        env:
          KIRI_COLOR_QA_EXE: ${{ runner.temp }}/kiri-installed-review/kiri.exe
        run: python scripts/qa/windows-capture-color-native.py
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: windows-capture-color-review
          path: windows-capture-color-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: windows-release-review
          path: windows-release-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: shortcut-native-review
          path: shortcut-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: confirmation-native-review
          path: confirmation-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: countdown-native-review
          path: countdown-native-review/
          retention-days: 5
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && needs.plan.outputs.package_windows == 'true' }}
        with:
          name: countdown-debug-build
          path: |
            src-tauri/target/release/kiri.exe
            src-tauri/target/release/*.pdb
          retention-days: 2
          if-no-files-found: warn
      - name: Upload Windows bundle
        if: needs.plan.outputs.package_windows == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kiri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  quality:
    name: CI quality gate
    needs: [plan, fast-checks, countdown-ui, test-rust, build-linux, build-windows, build-macos, test-linux-wayland, recheck-linux-x11]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected check and package to succeed
        env:
          KIRI_CI_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/qa/ci-plan.py
